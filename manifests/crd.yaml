apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: appdeployments.platform.example.com

spec:
  group: platform.example.com

  names:
    kind: AppDeployment
    plural: appdeployments
    singular: appdeployment

  scope: Namespaced

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                image:
                  type: string
                port:
                  type: integer
                  minimum: 1