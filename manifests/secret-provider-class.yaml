# secretproviderclass
# This Custom Resource tells the CSI driver exactly which backend to talk to (alibabacloud),
# what service to query (oos), and which secret to fetch.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nginx-oos-secret
  namespace: default 
spec:
  provider: alibabacloud
  parameters:
    objects: |
      - objectName: "MyNginxSecret"
        objectType: "oos"
        objectAlias: "index.html"

# Note: Using objectAlias: "index.html" forces the CSI driver to write the secret's value into a file specifically named index.html,
# which is exactly what NGINX needs.