apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
# Source 1: Helm Chart
    - chart: traefik
      repoURL: https://traefik.github.io/charts
      targetRevision: 41.0.1 # <-- The latest stable chart
      helm:
        valueFiles:
          - $values/my-cluster-repo/infrastructure/traefik/values.yaml
# Source 2: Git Repo (for values.yaml reference)
    - repoURL: 'https://github.com/tasnimmizaoui/alicloud-rke2-cluster.git'
      targetRevision: HEAD
      ref: values
    # # Source : Git Repo (for GatewayClass & extra manifests)
    # - repoURL: 'https://github.com/tasnimmizaoui/alicloud-rke2-cluster.git'
    #   path: my-cluster-repo/infrastructure/traefik/manifests
    #   targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true