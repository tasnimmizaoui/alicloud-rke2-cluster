apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - chart: traefik
      repoURL: https://traefik.github.io/charts
      targetRevision: 26.1.0 # Standard stable version
      helm:
        valueFiles:
          - $values/my-cluster-repo/infrastructure/traefik/values.yaml
    - repoURL: 'https://github.com/tasnimmizaoui/alicloud-rke2-cluster.git'
      path: my-cluster-repo
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true