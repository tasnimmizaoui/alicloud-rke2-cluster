apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami-test
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"  # Syncs after Traefik (wave 1) & Cert-Manager
spec:
  project: default
  source:
    repoURL: 'https://github.com/tasnimmizaoui/alicloud-rke2-cluster.git'
    targetRevision: HEAD
    path: my-cluster-repo/apps/whoami
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true