apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    # Source 1: Helm Chart
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 61.3.0
      helm:
        valueFiles:
          - $values/my-cluster-repo/infrastructure/monitoring/values.yaml

    # Source 2: Git Repo (for values.yaml)
    - repoURL: 'https://github.com/tasnimmizaoui/alicloud-rke2-cluster.git'
      targetRevision: HEAD
      ref: values

    # Source 3: Git Repo (for Certificate & HTTPRoute)
    - repoURL: 'https://github.com/tasnimmizaoui/alicloud-rke2-cluster.git'
      path: my-cluster-repo/infrastructure/monitoring/manifests
      directory:
        recurse: true # <-- This forces Argo CD to read the alerts/ sub-folder
      targetRevision: HEAD

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Needed for Prometheus CRDs