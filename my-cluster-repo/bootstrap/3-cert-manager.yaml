apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - chart: cert-manager
      repoURL: https://charts.jetstack.io
      targetRevision: v1.20.3  # Recommended stable version
      helm:
        valueFiles:
          - $values/infrastructure/cert-manager/values.yaml
    - repoURL: 'https://github.com/tasnimmizaoui/alicloud-rke2-cluster.git'
      path: my-cluster-repo
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true