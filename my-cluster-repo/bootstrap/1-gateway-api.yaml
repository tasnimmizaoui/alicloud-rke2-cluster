apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/tasnimmizaoui/alicloud-rke2-cluster.git'
    targetRevision: HEAD
    path: my-cluster-repo/infrastructure/gateway-api
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # <-- THIS FIXES THE ANNOTATION LIMIT ERROR! 