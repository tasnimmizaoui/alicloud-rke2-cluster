apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-ui-route
  namespace: argocd
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - "argocd.8.213.21.35.sslip.io"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: argocd-server
      port: 80