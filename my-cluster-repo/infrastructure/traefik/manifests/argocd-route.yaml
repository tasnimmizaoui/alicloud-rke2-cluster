apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-ui-route
  namespace: argocd
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    group: gateway.networking.k8s.io  # Added default group
    kind: Gateway                     # Added default kind
  hostnames:
  - "argocd.8.213.21.35.sslip.io"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: argocd-server
      port: 80
      group: ""                       # Added default group
      kind: Service                   # Added default kind
      weight: 1                       # Added default weight