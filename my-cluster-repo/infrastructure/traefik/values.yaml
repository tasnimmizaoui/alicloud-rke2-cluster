providers:
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true

gateway:
  enabled: true
  name: traefik-gateway
  listeners:
    web:
      port: 8000
      protocol: HTTP
      # Pass the string directly instead of a nested object
      namespacePolicy: "All"
    # websecure:
    #   port: 8443
    #   protocol: HTTPS
    #   # Pass the string directly instead of a nested object
    #   namespacePolicy: "All"

ingressRoute:
  dashboard:
    enabled: true

service:
  type: LoadBalancer