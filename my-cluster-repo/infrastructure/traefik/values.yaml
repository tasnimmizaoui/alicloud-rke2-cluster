providers:
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true

# Re-enable the official Gateway and allow cross-namespace routing
gateway:
  enabled: true
  listeners:
    web:
      namespacePolicy: All
    websecure:
      namespacePolicy: All

ingressRoute:
  dashboard:
    enabled: true

service:
  type: LoadBalancer