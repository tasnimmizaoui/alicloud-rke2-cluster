providers:
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true

gateway:
  enabled: true
  name: traefik-gateway
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        - name: test-app-tls-secret
          kind: Secret
        - name: argocd-tls-secret
          kind: Secret
        - name: grafana-tls-secret 
          kind: Secret

ingressRoute:
  dashboard:
    enabled: true

service:
  type: LoadBalancer