apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: high-cpu-alert
  namespace: monitoring
spec:
  folderRef: "operator-alerts" 
  instanceSelector:
    matchLabels:
      dashboards: "kube-prometheus"
  interval: 1m
  rules:
    - title: "NodeCPUHigh"
      uid: "node-cpu-high-rule-1"
      for: "1m" 
      condition: "C"
      noDataState: "NoData"
      execErrState: "Error"
      data:
        # Step A: Get the raw CPU percentage (Removed the >80 from here)
        - refId: "A"
          datasourceUid: "prometheus"
          model:
            datasource:
              type: "prometheus"
              uid: "prometheus"
            expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
            refId: "A"
            
        # Step C: Evaluate if A is > 80 using standard classic_conditions
        - refId: "C"
          datasourceUid: "__expr__"
          model:
            conditions:
              - evaluator:
                  params: [80]
                  type: "gt"
                operator:
                  type: "and"
                query:
                  params: ["A"]
                reducer:
                  params: []
                  type: "last"
                type: "query"
            datasource:
              type: "__expr__"
              uid: "__expr__"
            refId: "C"
            type: "classic_conditions"