apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: high-cpu-alert
  namespace: monitoring
spec:
  folderRef: "operator-alerts"
  instanceSelector:
    matchLabels:
      dashboards: "kube-prometheus"
  interval: 1m
  rules:
    - title: "NodeCPUHigh"
      uid: "node-cpu-high-rule-1"
      for: "1m"
      condition: "C"
      noDataState: "NoData"
      execErrState: "Error"
      data:
        # Step A: Prometheus query with explicit 5-minute relative time range
        - refId: "A"
          datasourceUid: "prometheus"
          relativeTimeRange:
            from: 300  # 300 seconds = 5 minutes ago
            to: 0      # 0 seconds = now
          model:
            datasource:
              type: "prometheus"
              uid: "prometheus"
            expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
            intervalMs: 1000
            maxDataPoints: 43200
            refId: "A"

        # Step B: Reduce to single value
        - refId: "B"
          datasourceUid: "__expr__"
          model:
            datasource:
              type: "__expr__"
              uid: "__expr__"
            expression: "A"
            reducer: "last"
            refId: "B"
            type: "reduce"

        # Step C: Evaluate condition
        - refId: "C"
          datasourceUid: "__expr__"
          model:
            datasource:
              type: "__expr__"
              uid: "__expr__"
            expression: "$B > 80"
            refId: "C"
            type: "math"