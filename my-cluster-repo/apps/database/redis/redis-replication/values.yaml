redisReplication:
  name: redis-replication
  clusterSize: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Inject Redis configurations directly into redis.conf
externalConfig:
  enabled: true
  data: |
    maxmemory-policy noeviction
    appendonly yes
    appendfsync everysec

# Storage configuration must be at the root level, not nested!
storageSpec:
  volumeClaimTemplate:
    spec:
      storageClassName: strict-essd-pl0-me-central-1a
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi