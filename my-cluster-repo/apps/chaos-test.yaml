# 1. The Memory Stress Test
apiVersion: v1
kind: Pod
metadata:
  name: chaos-memory
  namespace: default
spec:
  nodeName: izl4vdanha6mf7wuntbcgcz # Forcing it onto your highest memory node
  containers:
  - name: stress
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "400M", "--vm-hang", "0"]
---
# 2. The Crashing Pod Test
apiVersion: v1
kind: Pod
metadata:
  name: chaos-crash
  namespace: default
spec:
  containers:
  - name: fail
    image: busybox
    command: ["/bin/sh", "-c", "sleep 5 && echo 'Crashing intentionally' && exit 1"]
---
# 3. The CPU Stress Test
apiVersion: v1
kind: Pod
metadata:
  name: chaos-cpu-throttle
  namespace: default
spec:
  containers:
  - name: cpu-burner
    image: busybox
    # An infinite loop that demands 100% of a CPU core
    command: ["/bin/sh", "-c", "while true; do true; done"]
    resources:
      requests:
        cpu: "100m"  # Requests 0.1 CPU core
      limits:
        cpu: "200m"  # Hard limit at 0.2 CPU cores